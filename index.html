<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>부캉이 탈출작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout concept: one 9:16 map-style stage centered on a cream page; canvas game inside, HTML overlays for title/result, credit line under the stage. */
:root{
  --paper:#fbf1df;
  --ink:#3a2a20;
  --water:#a9d3ea;
  --canal:#6aaed0;
  --pin:#e5484d;
  --pin-deep:#a9272c;
  --cheer:#ee8fa3;
  --veil:rgba(251,241,223,.9);
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
}
.stage{
  position:relative;
  width:min(100%,calc((100vh - 72px)*.5625));
  width:min(100%,calc((100dvh - 72px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*.5625));
  aspect-ratio:9/16;border-radius:16px;overflow:hidden;container-type:inline-size;
  background:var(--water);box-shadow:0 0 0 2px var(--ink);user-select:none;-webkit-user-select:none;
}
canvas{display:block;width:100%;height:100%;touch-action:none}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3cqw;padding:6cqw;text-align:center;background:var(--veil);
}
.tag{
  display:inline-block;padding:.8cqw 3.4cqw;border:.7cqw solid var(--pin);border-radius:999px;
  background:#fff;font-family:var(--font-display);font-size:4cqw;line-height:1.3;
}
h1,h2{margin:0;font-family:var(--font-display);font-weight:400;line-height:1.05;text-wrap:balance}
h1{font-size:11cqw}
.mascot{width:30cqw;height:auto;max-height:36cqw;display:block;flex:none}
.wave{transform-box:view-box;transform-origin:90px 80px;animation:wave .9s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(18deg)}}
@media (prefers-reduced-motion:reduce){.wave{animation:none}}
h2{font-size:10.5cqw}
.screen{word-break:keep-all}
.lead{margin:0;font-size:4.4cqw;line-height:1.5;text-wrap:balance}
.how{list-style:none;margin:0;padding:0;display:grid;gap:2cqw;text-align:left;font-size:3.6cqw;line-height:1.4}
.how li{position:relative;padding-left:6cqw}
.how li::before{content:"";position:absolute;left:0;top:.5em;width:3.2cqw;height:3.2cqw;border-radius:50%;background:var(--dot)}
.how li[data-k="move"]{--dot:var(--canal)}
.how li[data-k="danger"]{--dot:var(--pin)}
.how li[data-k="cheer"]{--dot:var(--cheer)}
.how li[data-k="chicken"]{--dot:#e8a33a}
.go{
  margin-top:1cqw;font-family:var(--font-display);font-size:6.4cqw;color:#fff;background:var(--pin);
  border:0;border-radius:999px;padding:2.4cqw 11cqw;box-shadow:0 1.1cqw 0 var(--pin-deep);cursor:pointer;
  transition:transform .08s,box-shadow .08s;
}
.go:active{transform:translateY(.8cqw);box-shadow:0 .3cqw 0 var(--pin-deep)}
.go:focus-visible{outline:.8cqw solid var(--ink);outline-offset:.6cqw}
.fine{margin:0;font-size:3cqw;opacity:.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;width:100%;margin:0}
.stat{background:#fff;border-radius:3cqw;padding:2.4cqw 1cqw;min-width:0}
.stat dt{font-size:3cqw;opacity:.75}
.stat dd{margin:0;font-family:var(--font-display);font-size:7cqw;line-height:1.2}
.namebox{display:flex;gap:2cqw;width:100%;margin:0}
.namebox input{flex:1;min-width:0;font:inherit;font-size:max(16px,4.4cqw);padding:1.8cqw 3cqw;border:.7cqw solid var(--ink);border-radius:3cqw;background:#fff;color:var(--ink)}
.namebox input:focus-visible{outline:.7cqw solid var(--pin);outline-offset:.3cqw}
.mini{font-family:var(--font-display);font-size:max(16px,4.4cqw);color:#fff;background:var(--pin);border:0;border-radius:3cqw;padding:1.8cqw 4.5cqw;cursor:pointer;box-shadow:0 .8cqw 0 var(--pin-deep)}
.mini:active{transform:translateY(.6cqw);box-shadow:0 .2cqw 0 var(--pin-deep)}
.mini:disabled{opacity:.5;cursor:default}
.mini:focus-visible{outline:.7cqw solid var(--ink);outline-offset:.4cqw}
.rank{list-style:none;margin:0;padding:0;width:100%;max-height:41cqw;overflow-y:auto;display:grid;gap:1cqw;text-align:left}
.rank li{display:grid;grid-template-columns:7cqw minmax(0,1fr) auto;gap:2cqw;align-items:center;background:#fff;border-radius:2.4cqw;padding:1.2cqw 2.6cqw;font-size:3.7cqw;line-height:1.3}
.rank li.me{outline:.6cqw solid var(--pin)}
.rank li.empty{display:block;text-align:center;opacity:.7}
.rank .n{font-family:var(--font-display);color:var(--pin)}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .tg{margin-left:1.4cqw;padding:0 1.4cqw;border-radius:999px;background:var(--water);font-size:2.9cqw}
.rank .pt{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.credit{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 12px;font-size:12px;line-height:1.4;color:var(--ink)}
.credit{align-items:center}
.credit .lab{display:inline-flex;line-height:0}
.credit .lab img{display:block;height:40px;width:auto;max-width:100%}
.snd{font:inherit;font-size:12px;color:var(--ink);background:none;border:1px solid var(--ink);border-radius:999px;padding:1px 10px;cursor:pointer}
.snd:focus-visible{outline:2px solid var(--pin);outline-offset:2px}
.credit a{color:var(--ink);text-underline-offset:2px}
</style>

<script>
/* 랭킹 서버(Cloudflare Worker) 주소를 따옴표 안에 넣으세요. 예: "https://bukang-rank.내계정.workers.dev" */
window.RANK_API="https://bukang-rank.lloydnam.workers.dev";
</script>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv" role="img" aria-label="부캉이 탈출작전 게임 화면"></canvas>

  <section class="screen" id="scrTitle">
    <span class="tag">9/18 처음 발견</span>
    <svg class="mascot" viewBox="0 0 130 140" role="img" aria-label="손을 흔드는 의인화 부캉이">
      <ellipse cx="62" cy="134" rx="30" ry="4" fill="rgba(58,42,32,0.15)"/>
      <path d="M86 112 Q108 108 112 124 Q96 124 84 120 Z" fill="#5f6e84" stroke="#46546a" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="50" cy="124" rx="9" ry="6" fill="#5f6e84" stroke="#46546a" stroke-width="2"/>
      <ellipse cx="74" cy="124" rx="9" ry="6" fill="#5f6e84" stroke="#46546a" stroke-width="2"/>
      <path d="M52 30 L60 6 L74 32 Z" fill="#5f6e84" stroke="#46546a" stroke-width="2" stroke-linejoin="round"/>
      <path d="M34 82 Q22 90 24 104" fill="none" stroke="#5f6e84" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="62" cy="76" rx="36" ry="46" fill="#718198" stroke="#46546a" stroke-width="2.5"/>
      <ellipse cx="62" cy="88" rx="23" ry="32" fill="#f3f6fa"/>
      <path d="M33 99 Q62 114 91 99 L89 108 Q62 122 35 108 Z" fill="#e5484d" stroke="#a9272c" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="49" cy="58" r="4.6" fill="#2b2220"/><circle cx="75" cy="58" r="4.6" fill="#2b2220"/>
      <circle cx="50.6" cy="56.2" r="1.5" fill="#fff"/><circle cx="76.6" cy="56.2" r="1.5" fill="#fff"/>
      <ellipse cx="41" cy="68" rx="6" ry="3.6" fill="rgba(255,140,160,0.6)"/><ellipse cx="83" cy="68" rx="6" ry="3.6" fill="rgba(255,140,160,0.6)"/>
      <path d="M50 70 Q62 82 74 70 Q62 74 50 70 Z" fill="#fff" stroke="#2b2220" stroke-width="2" stroke-linejoin="round"/>
      <path d="M38 76 L42 84 M33 80 L38 88" stroke="rgba(70,84,106,0.6)" stroke-width="1.6" stroke-linecap="round"/>
      <g class="wave">
        <path d="M90 80 Q104 70 108 50" fill="none" stroke="#718198" stroke-width="11" stroke-linecap="round"/>
        <path d="M90 80 Q104 70 108 50" fill="none" stroke="#46546a" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
        <circle cx="109" cy="46" r="8" fill="#718198" stroke="#46546a" stroke-width="2"/>
        <path d="M104 40 L102 34 M109 38 L109 31 M114 40 L116 34" stroke="#46546a" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <path d="M118 28 Q124 34 118 40 M122 24 Q130 34 122 44" fill="none" stroke="#6aaed0" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <h1>부캉이<br>탈출작전</h1>
    <p class="lead">부산시 그물을 피해 60초만 버티면 먼 바다로 탈출해요.</p>
    <ul class="how">
      <li data-k="move">화면을 드래그해서 헤엄쳐요. PC는 방향키나 WASD예요.</li>
      <li data-k="danger">빨간 원이 차오르면 그물이 떨어져요. 바로 벗어나요.</li>
      <li data-k="chicken">치킨 빌런이 던지는 치킨도 피해요. 주황 원 안이 떨어질 자리예요.</li>
      <li data-k="cheer">시민들이 던지는 하트를 모아요. 응원이 가득 차면 대시로 그물을 통과해요.</li>
    </ul>
    <button class="go" id="btnStart" type="button">출발!</button>
    <p class="fine" id="bestLine">비공식 팬 게임이에요. 실제 기관과 관련이 없어요.</p>
  </section>

  <section class="screen" id="scrEnd" hidden>
    <h2 id="endTitle">탈출 성공!</h2>
    <p class="lead" id="endMsg"></p>
    <dl class="stats">
      <div class="stat"><dt>버틴 시간</dt><dd id="stTime">0초</dd></div>
      <div class="stat"><dt>모은 하트</dt><dd id="stHearts">0</dd></div>
      <div class="stat"><dt>응원 대시</dt><dd id="stDash">0회</dd></div>
    </dl>
    <form class="namebox" id="nameForm" autocomplete="off">
      <label class="sr" for="nameIn">이름</label>
      <input id="nameIn" type="text" maxlength="8" placeholder="이름 (최대 8자)">
      <button class="mini" id="btnSave" type="submit">등록</button>
    </form>
    <ol class="rank" id="rankList" aria-label="참가자 랭킹"></ol>
    <p class="fine" id="rankNote"></p>
    <p class="fine" id="endBest"></p>
    <button class="go" id="btnAgain" type="button">다시 도전</button>
  </section>
</div>

<footer class="credit">
  <a class="lab" href="https://github.com/lloydknam" target="_blank" rel="noopener" title="GitHub(@lloydknam)"><img src="assets/brand/lockup-light.svg" alt="Lloyd's Balcony Lab · with claude · GitHub(@lloydknam)" height="40"></a>
  <button class="snd" id="btnSnd" type="button" aria-pressed="true">소리 끄기</button>
</footer>

<script>
(function(){
'use strict';
var W=360,H=640,GOAL=60,DASH_T=3.2,SP=215;
var XMIN=54,XMAX=306,YMIN=78,YMAX=584,BAR_Y=596;
var C={water:'#a9d3ea',park:'#cfe3b4',sand:'#f6ecd2',ink:'#3a2a20',pin:'#e5484d',paper:'#fbf1df',canal:'#6aaed0'};
var FD='"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
var FB='"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
var RM=false;
try{RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
try{if(document.fonts&&document.fonts.load){document.fonts.load('20px Jua');document.fonts.load('12px "Gowun Dodum"');}}catch(e){}

var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
var scrTitle=document.getElementById('scrTitle'),scrEnd=document.getElementById('scrEnd');
var scale=1;
function resize(){
  var r=stage.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
  scale=cv.width/W;
}
window.addEventListener('resize',resize);
if(window.ResizeObserver){new ResizeObserver(resize).observe(stage);}
resize();

function rand(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);}
function rrect(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);return;}
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function heartPath(x,y,s){
  ctx.beginPath();
  ctx.moveTo(x,y+s*0.9);
  ctx.bezierCurveTo(x-s*1.4,y-s*0.1,x-s*0.7,y-s*1.1,x,y-s*0.4);
  ctx.bezierCurveTo(x+s*0.7,y-s*1.1,x+s*1.4,y-s*0.1,x,y+s*0.9);
  ctx.closePath();
}
function bankL(y){return 46+Math.sin(y*0.02)*4;}
function bankR(y){return 314-Math.sin(y*0.017+1)*4;}

/* ---------- citizens ---------- */
var SKINS=['#f6d3b3','#eec29b','#d9a67a'],HAIRS=['#2b2220','#4a3326','#1f1a18','#6b4a2b'];
var COLS=['#e5484d','#f0a63a','#4aa3a0','#7a6bd1','#e46aa0','#58a55c','#ffffff'];
var citizens=[];
(function(){
  for(var s=-1;s<=1;s+=2){
    for(var i=0;i<12;i++){
      citizens.push({side:s,x:s<0?rand(10,34):rand(326,350),y:92+i*40+rand(-6,6),
        col:pick(COLS),skin:pick(SKINS),hair:pick(HAIRS),ph:rand(0,6.28),flag:Math.random()<0.3,toss:0,talk:0});
    }
  }
})();
function randCitizen(){return pick(citizens);}
function citizenNear(side,y){
  var best=null,bd=1e9;
  for(var i=0;i<citizens.length;i++){var c=citizens[i];if(c.side!==side)continue;var d=Math.abs(c.y-y);if(d<bd){bd=d;best=c;}}
  return best;
}
var CHEERP=['부캉아 힘내!','도망가!','잡히지 마!','응원해요!','파이팅!','그물 조심!','먼 바다로 가!','조금만 더!','부캉이 최고!','우리가 지켜볼게!'];
var DASHP=['와아아!','부캉이 최고!','달려라 부캉!','이대로 쭉!'];
var HITP=['앗!','괜찮아?','힘내!','다시 일어나!'];

/* ---------- state ---------- */
var mode='title',T=0,last=0;
var shark,game,nets,sweeps,hearts,bubbles,fx,chickens,villain;
var input={active:false,id:null,sx:0,sy:0,x0:0,y0:0,gx:0,gy:0,l:0,r:0,u:0,d:0};

function newGame(){
  shark={x:W/2,y:430,vx:0,vy:0,face:1,r:12,inv:0,dash:0,tilt:0};
  game={t:0,lives:3,cheer:0,collected:0,dashes:0,nextNet:1.6,nextSweep:9,nextHeart:0.5,nextBubble:0.8,nextChicken:7,shake:0,flash:0,trail:0,won:false,endT:0};
  nets=[];sweeps=[];hearts=[];bubbles=[];fx=[];chickens=[];villain={side:1,y:300,q:0,cd:0,t:0,vis:0,throwA:0};
  input.active=false;input.id=null;
}

/* ---------- effects ---------- */
function burst(x,y,kind,n,col){
  for(var i=0;i<n;i++){
    var a=rand(0,6.283),s=rand(40,150);
    fx.push({k:kind,x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,age:0,life:rand(0.5,0.9),sz:rand(4,8),col:col||C.pin});
  }
}
function addText(x,y,text,col,size,life){fx.push({k:'text',x:x,y:y,vx:0,vy:-34,age:0,life:life||1.1,sz:size||14,col:col||C.pin,text:text});}
function addRing(x,y,r,col){fx.push({k:'ring',x:x,y:y,vx:0,vy:0,age:0,life:0.6,sz:r,col:col});}
function updateFx(dt){
  for(var i=fx.length-1;i>=0;i--){
    var f=fx[i];f.age+=dt;
    if(f.age>=f.life){fx.splice(i,1);continue;}
    f.x+=f.vx*dt;f.y+=f.vy*dt;
    if(f.k==='heart'){f.vx*=0.97;f.vy*=0.97;}
    else if(f.k==='drop'){f.vy+=260*dt;}
  }
}
function addBubble(c,text){
  if(bubbles.length>=4)bubbles.shift();
  bubbles.push({c:c,text:text,age:0,life:2.1});
}

/* ---------- spawns ---------- */
function spawnNet(){
  var tx=clamp(shark.x+shark.vx*0.35+rand(-26,26),68,292);
  var ty=clamp(shark.y+shark.vy*0.35+rand(-26,26),92,572);
  var side=tx<W/2?-1:1;
  var tel=Math.max(0.78,1.25-game.t*0.008);
  nets.push({x:tx,y:ty,sx:side<0?20:340,sy:clamp(ty+rand(-60,60),90,570),side:side,
    R:38+Math.min(14,game.t*0.25),tel:tel,life:1.5,age:0,landed:false});
}
function spawnSweep(){
  var gw=Math.max(88,128-game.t*0.7);
  var gx=rand(60+gw/2+8,300-gw/2-8);
  sweeps.push({y:-64,gx:gx,gw:gw,sp:84+game.t*0.6,h:20});
}
function spawnHeart(){
  if(hearts.length>=6)return;
  var ty=clamp(shark.y+rand(-140,140),92,572);
  var side=Math.random()<0.5?-1:1;
  var c=citizenNear(side,ty);
  var tx=side<0?rand(70,170):rand(190,290);
  hearts.push({sx:c.x,sy:c.y-6,tx:tx,ty:clamp(ty+rand(-20,20),90,572),x:c.x,y:c.y,age:0,p:0,state:'fly',fa:0,ph:rand(0,6.28)});
  c.toss=0.5;
}

/* ---------- update ---------- */
function ambient(dt){
  var g=game;
  g.nextHeart-=dt;
  if(g.nextHeart<=0){spawnHeart();g.nextHeart=rand(0.9,1.5)*(shark.dash>0?0.6:1);}
  g.nextBubble-=dt;
  if(g.nextBubble<=0){addBubble(randCitizen(),pick(shark.dash>0?DASHP:CHEERP));g.nextBubble=rand(1.0,1.8);}
  for(var i=bubbles.length-1;i>=0;i--){bubbles[i].age+=dt;if(bubbles[i].age>bubbles[i].life)bubbles.splice(i,1);}
  for(var j=0;j<citizens.length;j++){if(citizens[j].toss>0)citizens[j].toss-=dt;}
  updateFx(dt);
}
function updateHearts(dt,collect){
  for(var i=hearts.length-1;i>=0;i--){
    var h=hearts[i];h.age+=dt;
    if(h.state==='fly'){
      h.p=Math.min(1,h.age/0.75);
      h.x=lerp(h.sx,h.tx,h.p);h.y=lerp(h.sy,h.ty,h.p)-Math.sin(Math.PI*h.p)*46;
      if(h.p>=1){h.state='float';h.fa=0;}
    }else{
      h.fa+=dt;h.x=h.tx+Math.sin(T*1.6+h.ph)*3;h.y=h.ty+Math.sin(T*2.2+h.ph)*2.5;
    }
    if(collect&&(h.state==='float'||h.p>0.5)){
      var dx=h.x-shark.x,dy=h.y-shark.y;
      if(dx*dx+dy*dy<(shark.r+13)*(shark.r+13)){collectHeart(h);hearts.splice(i,1);continue;}
    }
    if(h.state==='float'&&h.fa>6.5)hearts.splice(i,1);
  }
}
function collectHeart(h){
  var g=game;g.collected++;
  burst(h.x,h.y,'heart',6,'#ee8fa3');
  addText(h.x,h.y-12,'+응원','#d4506a',13,0.8);

    var before=g.cheer;
    g.cheer=Math.min(100,g.cheer+11);
    if(before<100&&g.cheer>=100){
      addText(W/2,300,'응원 가득! 아래 버튼을 눌러요','#d4506a',16,1.8);
      for(var i=0;i<3;i++)addBubble(randCitizen(),pick(DASHP));
    }
  }
}
function tryDash(){
  if(mode!=='play')return;
  if(game.cheer>=100&&shark.dash<=0){
    shark.dash=DASH_T;game.dashes++;
    addText(shark.x,shark.y-34,'응원 폭발!',C.pin,20,1.3);
    burst(shark.x,shark.y,'heart',14,'#ee8fa3');
    addRing(shark.x,shark.y,60,'#ee8fa3');
    for(var i=0;i<4;i++)addBubble(randCitizen(),pick(DASHP));
  }
}
function moveShark(dt){
  var sp=SP*(shark.dash>0?1.55:1),dx=0,dy=0;
  if(input.active){dx=(input.gx-shark.x)*7;dy=(input.gy-shark.y)*7;}
  var kx=input.r-input.l,ky=input.d-input.u;
  if(kx||ky){var m=Math.hypot(kx,ky);dx=kx/m*sp;dy=ky/m*sp;}
  var m2=Math.hypot(dx,dy);if(m2>sp){dx=dx/m2*sp;dy=dy/m2*sp;}
  var k=Math.min(1,dt*10);
  shark.vx+=(dx-shark.vx)*k;shark.vy+=(dy-shark.vy)*k;
  shark.x+=shark.vx*dt;shark.y+=shark.vy*dt;
  if(shark.x<XMIN){shark.x=XMIN;shark.vx=Math.max(0,shark.vx);}
  if(shark.x>XMAX){shark.x=XMAX;shark.vx=Math.min(0,shark.vx);}
  if(shark.y<YMIN){shark.y=YMIN;shark.vy=Math.max(0,shark.vy);}
  if(shark.y>YMAX){shark.y=YMAX;shark.vy=Math.min(0,shark.vy);}
  if(Math.abs(shark.vx)>14)shark.face=shark.vx>0?1:-1;
  var tt=clamp(shark.vy/260,-0.4,0.4)*(Math.abs(shark.vx)>20?1:0.6);
  shark.tilt+=(tt-shark.tilt)*Math.min(1,dt*8);
}
function loseLife(nx,ny){
  if(shark.inv>0||shark.dash>0)return;
  var g=game;g.lives--;shark.inv=1.6;g.shake=0.35;g.flash=0.5;
  shark.x=clamp(shark.x+nx*18,XMIN,XMAX);shark.y=clamp(shark.y+ny*18,YMIN,YMAX);
  burst(shark.x,shark.y,'drop',10,'#ffffff');
  for(var i=0;i<2;i++)addBubble(randCitizen(),pick(HITP));
  if(g.lives<=0)endGame(false);
}
/* ---------- chicken villain ---------- */
function startVolley(){
  var side=Math.random()<0.5?-1:1;
  villain.side=side;villain.y=rand(150,500);
  villain.q=3+(game.t>35?1:0);villain.cd=0.7;
  villain.t=0.7+villain.q*0.55+0.8;
  addText(side<0?64:296,villain.y-40,'치킨 배달이다!','#7a3fb0',14,1.3);
  addBubble(randCitizen(),'치킨 조심!');
}
function throwChicken(){
  var tx=clamp(shark.x+shark.vx*0.5+rand(-30,30),70,290);
  var ty=clamp(shark.y+shark.vy*0.5+rand(-30,30),92,572);
  chickens.push({sx:villain.side<0?30:330,sy:villain.y-14,x:tx,y:ty,age:0,fly:0.95,life:0.5,landed:false});
  villain.throwA=0.3;
}
function updateVillain(dt){
  var v=villain;
  v.t-=dt;v.throwA-=dt;
  v.vis+=((v.t>0?1:0)-v.vis)*Math.min(1,dt*7);
  if(v.q>0){v.cd-=dt;if(v.cd<=0){throwChicken();v.q--;v.cd=0.55;}}
}
function updateChickens(dt){
  for(var i=chickens.length-1;i>=0;i--){
    var c=chickens[i];c.age+=dt;
    if(!c.landed&&c.age>=c.fly){c.landed=true;addRing(c.x,c.y,36,'#e8a33a');burst(c.x,c.y,'drop',8,'#e8a33a');}
    if(c.age>c.fly+c.life){chickens.splice(i,1);continue;}
    if(c.landed&&c.age<c.fly+0.3){
      var dx=shark.x-c.x,dy=shark.y-c.y,d=Math.hypot(dx,dy);
      if(d<22+shark.r*0.4){loseLife(dx/(d||1),dy/(d||1));if(game.lives<=0)return;}
    }
  }
}
function step(dt){
  var g=game;
  g.t+=dt;
  g.shake=Math.max(0,g.shake-dt*2.5);g.flash=Math.max(0,g.flash-dt*1.6);
  if(shark.inv>0)shark.inv-=dt;
  g.nextNet-=dt;
  if(g.nextNet<=0){
    spawnNet();
    if(g.t>24&&Math.random()<0.35)spawnNet();
    g.nextNet=Math.max(0.75,2.1-g.t*0.022)*rand(0.85,1.15);
  }
  g.nextSweep-=dt;
  if(g.nextSweep<=0){spawnSweep();g.nextSweep=Math.max(7.5,12-g.t*0.07);}
  g.nextChicken-=dt;
  if(g.t>5&&g.nextChicken<=0){startVolley();g.nextChicken=Math.max(6,rand(9,12)-g.t*0.05);}
  updateVillain(dt);
  moveShark(dt);
  if(shark.dash>0){
    shark.dash-=dt;g.cheer=Math.max(0,100*shark.dash/DASH_T);
    g.trail-=dt;if(g.trail<=0){burst(shark.x-shark.face*14,shark.y,'heart',1,'#ee8fa3');g.trail=0.06;}
    if(shark.dash<=0){shark.dash=0;g.cheer=0;shark.inv=Math.max(shark.inv,0.7);}
  }
  ambient(dt);
  updateHearts(dt,true);
  var i;
  for(i=nets.length-1;i>=0;i--){
    var n=nets[i];n.age+=dt;
    if(!n.landed&&n.age>=n.tel){n.landed=true;addRing(n.x,n.y,n.R+10,'#ffffff');burst(n.x,n.y,'drop',8,'#ffffff');}
    if(n.age>n.tel+n.life){nets.splice(i,1);continue;}
    if(n.age>n.tel+0.06&&n.age<n.tel+n.life-0.25){
      var dx=shark.x-n.x,dy=shark.y-n.y,d=Math.hypot(dx,dy),hit=n.R*0.9+shark.r*0.4;
      if(d<hit)loseLife(dx/(d||1),dy/(d||1));
      if(game.lives<=0)return;
    }
  }
  for(i=sweeps.length-1;i>=0;i--){
    var s=sweeps[i];s.y+=s.sp*dt;
    if(s.y>H+40){sweeps.splice(i,1);continue;}
    if(Math.abs(shark.y-s.y)<s.h/2+shark.r*0.7){
      var inGap=shark.x-shark.r*0.5>s.gx-s.gw/2&&shark.x+shark.r*0.5<s.gx+s.gw/2;
      if(!inGap)loseLife(0,1);
      if(game.lives<=0)return;
    }
  }
  updateChickens(dt);
  if(game.lives<=0)return;
  if(g.t>=GOAL)endGame(true);
}
function idle(dt){
  if(mode==='title'){
    shark.x=W/2+Math.sin(T*0.9)*50;shark.y=400+Math.sin(T*1.7)*16;
    shark.vx=Math.cos(T*0.9)*45;shark.vy=Math.cos(T*1.7)*27;
    shark.face=shark.vx>=0?1:-1;shark.tilt=clamp(shark.vy/260,-0.4,0.4);
  }else if(mode==='end'){
    game.endT+=dt;

      shark.y-=120*dt;shark.x+=Math.sin(T*3)*20*dt;shark.tilt=-0.25;

    }

}

var LEAD=[69,0,72,74,76,0,74,72,69,71,72,0,67,0,69,0,72,74,76,0,79,76,74,0,72,0,69,71,69,0,0,0];
var ROOT=[45,41,43,45];
function mf(m){return 440*Math.pow(2,(m-69)/12);}
function tone(f,t,d,type,v){
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);

  ctx.fillStyle=(ready||shark.dash>0)?'#fff':'rgba(58,42,32,0.45)';
  ctx.textAlign='center';ctx.font='15px '+FD;
  ctx.fillText(shark.dash>0?'대시 '+shark.dash.toFixed(1)+'초':'응원 대시',0,1);
  ctx.restore();
}
function render(){
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.clearRect(0,0,W,H);
  var i;
  ctx.save();
  if(mode==='play'&&game.shake>0&&!RM)ctx.translate(rand(-1,1)*game.shake*10,rand(-1,1)*game.shake*10);
  drawBackground(T);
  for(i=0;i<citizens.length;i++)citizens[i].talk=0;
  for(i=0;i<bubbles.length;i++)bubbles[i].c.talk=1;
  if(mode==='play'&&game.t<4){
    var pa=game.t<3?1:4-game.t;
    ctx.save();ctx.globalAlpha=pa;
    ctx.strokeStyle=C.pin;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(W/2,380);ctx.lineTo(W/2,404);ctx.stroke();
    ctx.font='12px '+FD;var tw=ctx.measureText('9/18 처음 발견').width+18;
    rrect(W/2-tw/2,358,tw,22,11);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=C.pin;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=C.ink;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('9/18 처음 발견',W/2,369.5);
    circle(W/2,404,5);ctx.fillStyle=C.pin;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
  }
  for(i=0;i<citizens.length;i++)drawCitizen(citizens[i]);
  for(i=0;i<hearts.length;i++)drawHeartItem(hearts[i]);
  for(i=0;i<nets.length;i++)drawNet(nets[i]);
  for(i=0;i<sweeps.length;i++)drawSweep(sweeps[i]);
  drawVillain();
  for(i=0;i<chickens.length;i++)drawChicken(chickens[i]);
  drawBubbles();
  drawShark(shark);
  if(mode==='end'&&!game.won)drawNetDisc(shark.x,shark.y,34,Math.min(1,game.endT*4));
  drawFx();
  ctx.restore();
  if(mode==='play'||mode==='end'){
    if(game.flash>0){ctx.fillStyle='rgba(229,72,77,'+(game.flash*0.35)+')';ctx.fillRect(0,0,W,H);}
    drawHUD();
    if(mode==='play'&&game.t<1.6){
      ctx.save();ctx.globalAlpha=1-game.t/1.6;ctx.font='46px '+FD;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
      ctx.strokeStyle=C.paper;ctx.lineWidth=9;ctx.strokeText('도망쳐!',W/2,250);
      ctx.fillStyle=C.pin;ctx.fillText('도망쳐!',W/2,250);ctx.restore();
    }
  }
}
function frame(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0.016);
  last=ts;T+=dt;
  if(mode==='play')step(dt);else idle(dt);
  render();
  requestAnimationFrame(frame);
}
newGame();
last=performance.now();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
